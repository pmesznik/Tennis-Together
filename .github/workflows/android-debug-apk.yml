name: Build Android Debug APK

# Szybki, NIEPODPISANY (debug) build do testowania na własnym telefonie —
# bez klucza podpisującego (Android Gradle Plugin ma wbudowany domyślny
# keystore "debug"). Nie nadaje się do Google Play — tam potrzebny będzie
# android-build.yml z prawdziwym kluczem (patrz PLAN.md).
#
# Uruchamiane RĘCZNIE: zakładka "Actions" w repo → ten workflow z listy po
# lewej → przycisk "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java (JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalacja zależności
        run: npm ci

      - name: Build web (Vite)
        env:
          # Klucz "anon/publishable" jest z definicji publiczny (patrz
          # src/lib/supabase.js) — bezpiecznie trzymać go wprost tutaj,
          # bez sekretu, żeby uruchomienie nie wymagało dodatkowej
          # konfiguracji w repo.
          VITE_SUPABASE_URL: https://jrabxtiranllayerhutm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8-yxyMhoEEq-kHx2opU0Pg_QylogBur
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Build APK (debug, niepodpisany)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nazwij plik z numerem wersji
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk"

      - name: Udostępnij APK (artifact przebiegu)
        uses: actions/upload-artifact@v7
        with:
          name: tennis-together-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk
          if-no-files-found: error
